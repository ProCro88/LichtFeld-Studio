name: Manual Windows vcpkg Dependency Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vcpkg-dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vcpkg-audit:
    name: Resolve and scan native Windows dependencies
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Read pinned vcpkg baseline
        id: baseline
        shell: pwsh
        run: |
          $manifest = Get-Content vcpkg.json -Raw | ConvertFrom-Json
          if (-not $manifest.'builtin-baseline') {
            throw "vcpkg.json does not define builtin-baseline"
          }
          "commit=$($manifest.'builtin-baseline')" >> $env:GITHUB_OUTPUT
          Write-Host "Pinned vcpkg baseline: $($manifest.'builtin-baseline')"

      - name: Checkout vcpkg at the manifest baseline
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          if ($LASTEXITCODE -ne 0) { throw "Could not clone vcpkg" }
          git -C "$env:RUNNER_TEMP\vcpkg" checkout "${{ steps.baseline.outputs.commit }}"
          if ($LASTEXITCODE -ne 0) { throw "Could not check out the pinned vcpkg baseline" }
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed" }
          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" >> $env:GITHUB_ENV
          "VCPKG_DISABLE_METRICS=1" >> $env:GITHUB_ENV

      - name: Resolve the project's Windows x64 dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows --host-triplet x64-windows --x-install-root "$env:GITHUB_WORKSPACE\vcpkg_installed"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg dependency installation failed" }

      - name: Export resolved package inventory for OSV
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = @(& "$env:VCPKG_ROOT\vcpkg.exe" list --x-install-root "$env:GITHUB_WORKSPACE\vcpkg_installed")
          if ($LASTEXITCODE -ne 0) { throw "vcpkg list failed" }

          $packages = @()
          foreach ($line in $lines) {
            if ($line -match '^([a-z0-9][a-z0-9-]*):x64-windows\s+(\S+)') {
              $packages += @{
                package = @{
                  name = $Matches[1]
                  version = $Matches[2]
                  ecosystem = 'vcpkg'
                }
              }
            }
          }
          if ($packages.Count -eq 0) {
            throw "No x64-windows packages were found in the resolved vcpkg inventory"
          }

          $custom = @{ results = @(@{ packages = $packages }) }
          $custom | ConvertTo-Json -Depth 10 | Set-Content -Path osv-vcpkg-lockfile.json -Encoding utf8
          Write-Host "Exported $($packages.Count) resolved vcpkg packages for OSV scanning."


      - name: Install pinned OSV Scanner
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false

      - name: Build OSV Scanner from its pinned release
        shell: pwsh
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0
          if ($LASTEXITCODE -ne 0) { throw "OSV Scanner installation failed" }
          "$env:USERPROFILE\go\bin" >> $env:GITHUB_PATH

      - name: Scan resolved vcpkg package inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          osv-scanner scan --lockfile "osv-scanner:$env:GITHUB_WORKSPACE\osv-vcpkg-lockfile.json" --format json --output-file osv-vcpkg-results.json
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "OSV Scanner returned a non-zero status. The JSON report will still be uploaded if it was produced."
            if (-not (Test-Path osv-vcpkg-results.json)) { throw "OSV Scanner failed without producing a report" }
          }

      - name: Upload native dependency audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lichtfeld-windows-vcpkg-audit
          path: |
            osv-vcpkg-lockfile.json
            osv-vcpkg-results.json
          if-no-files-found: warn
          retention-days: 14
