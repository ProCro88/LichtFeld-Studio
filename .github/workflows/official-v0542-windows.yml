name: Official upstream v0.5.4.2 Windows portable build

on:
  push:
    branches:
      - build/official-v0.5.4.2-windows
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      VCPKG_ROOT: ${{ runner.temp }}\\vcpkg
      VCPKG_BUILD_TYPE: release
      CUDA_PATH: C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v12.8
      BUILD_DIR: b
      SOURCE_REPOSITORY: MrNeRF/LichtFeld-Studio
      SOURCE_TAG: v0.5.4.2
      EXPECTED_SOURCE_COMMIT: fac5e497aeabfa44b9d09e2b52f22a721aa3a28c

    steps:
      - name: Checkout official upstream source tag
        uses: actions/checkout@v7
        with:
          repository: MrNeRF/LichtFeld-Studio
          ref: v0.5.4.2
          path: source
          fetch-depth: 0
          submodules: recursive

      - name: Verify exact upstream source commit
        shell: pwsh
        run: |
          $actual = (git -C source rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SOURCE_COMMIT) {
            throw "Unexpected source commit: $actual"
          }
          "Verified official source: $env:SOURCE_REPOSITORY@$env:SOURCE_TAG ($actual)"

      - name: Install CUDA 12.8
        shell: pwsh
        run: |
          Invoke-WebRequest https://developer.download.nvidia.com/compute/cuda/12.8.0/local_installers/cuda_12.8.0_571.96_windows.exe -OutFile "$env:RUNNER_TEMP\\cuda.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\\cuda.exe" -ArgumentList "-y -s -accepteula -toolkit -override -noDisplayDriver" -Wait

      - name: Set CUDA environment
        shell: pwsh
        run: |
          "CUDA_PATH=$env:CUDA_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CUDA_PATH_V12_8=$env:CUDA_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$env:CUDA_PATH\\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed" }
          "VCPKG_ROOT=$env:VCPKG_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure official Release source as portable build
        shell: cmd
        working-directory: source
        run: |
          call "C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC\\Auxiliary\\Build\\vcvars64.bat"
          python tools\\ci_retry_configure.py -- cmake -B %BUILD_DIR% -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_PORTABLE=ON -DLFS_FAST_COMPILE=ON -DBUILD_FORMAT_TESTS=OFF -DBUILD_VISUALIZER_TESTS=OFF -DBUILD_UNICODE_TEST_ONLY=OFF -DBUILD_PYTHON_STUBS=OFF -DLFS_DEV_IMPORT_SOURCE_PYTHON=OFF -DLFS_DEV_IMPORT_SOURCE_RESOURCES=OFF -DLFS_ENABLE_CUDA_DEVICE_DEBUG=OFF

      - name: Build Release
        shell: cmd
        working-directory: source
        run: |
          call "C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\VC\\Auxiliary\\Build\\vcvars64.bat"
          set PATH=%CD%\\%BUILD_DIR%;%CD%\\%BUILD_DIR%\\vcpkg_installed\\x64-windows\\bin;%PATH%
          cmake --build %BUILD_DIR% -j %NUMBER_OF_PROCESSORS%

      - name: Install and verify portable distribution
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:RUNNER_TEMP 'lichtfeld-official-v0542-dist'
          cmake --install $env:BUILD_DIR --prefix $dist
          if ($LASTEXITCODE -ne 0) { throw 'CMake install failed' }
          $exe = Join-Path $dist 'bin\\LichtFeld-Studio.exe'
          if (-not (Test-Path $exe)) { throw "Installed executable missing: $exe" }
          @(
            "Source repository: $env:SOURCE_REPOSITORY"
            "Source tag: $env:SOURCE_TAG"
            "Source commit: $env:EXPECTED_SOURCE_COMMIT"
            "Build type: Release"
            "CUDA Toolkit: 12.8"
            "Portable: BUILD_PORTABLE=ON"
            "Source modifications: none"
          ) | Set-Content (Join-Path $dist 'BUILD-INFO.txt')

      - name: Package ZIP and calculate SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:RUNNER_TEMP 'lichtfeld-official-v0542-dist'
          $zip = Join-Path $env:RUNNER_TEMP 'LichtFeld-Studio-v0.5.4.2-official-source-Windows-x64.zip'
          Compress-Archive -Path (Join-Path $dist '*') -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path $zip)) { throw 'ZIP was not created' }
          Get-FileHash $zip -Algorithm SHA256 | Format-List | Out-String | Write-Host

      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: LichtFeld-Studio-v0.5.4.2-official-source-Windows-x64
          path: ${{ runner.temp }}/LichtFeld-Studio-v0.5.4.2-official-source-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
