name: Windows CUDA Build

on:
  push:
    branches: [ dev, master, security/hardening-audit-2026-11 ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ dev, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-preflight:
    uses: ./.github/workflows/windows-build-preflight.yml

  test-plugin-venv:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Download Python embeddable
        shell: pwsh
        run: |
          Invoke-WebRequest "https://www.python.org/ftp/python/3.12.8/python-3.12.8-embed-amd64.zip" -OutFile python-embed.zip
          Expand-Archive python-embed.zip -DestinationPath python-embed

      - name: Test uv sync with embedded Python
        shell: pwsh
        run: |
          $PYTHON = "$PWD\python-embed\python.exe"

          # Create minimal test plugin
          $PLUGIN = "$env:TEMP\test_plugin"
          New-Item -ItemType Directory -Force -Path $PLUGIN
          @"
          [project]
          name = "test-plugin"
          version = "0.1.0"
          requires-python = ">=3.12"
          dependencies = []
          "@ | Set-Content "$PLUGIN\pyproject.toml"

          # Test 1: uv sync creates venv
          uv sync --project $PLUGIN --python $PYTHON
          if (-not (Test-Path "$PLUGIN\.venv\Scripts\python.exe")) {
            Write-Error "FAIL: venv python not created"
            exit 1
          }
          Write-Host "PASS: uv sync created venv with python.exe"

          # Test 2: broken venv recovery
          Remove-Item "$PLUGIN\.venv\Scripts\python.exe"
          uv sync --project $PLUGIN --python $PYTHON
          if (-not (Test-Path "$PLUGIN\.venv\Scripts\python.exe")) {
            Write-Error "FAIL: broken venv not recovered"
            exit 1
          }
          Write-Host "PASS: uv sync recovered broken venv"

          # Test 3: uv sync works when PYTHONHOME is set (simulates in-app environment)
          Remove-Item -Recurse -Force "$PLUGIN\.venv"
          $env:PYTHONHOME = "$PWD\python-embed"
          uv sync --project $PLUGIN --python $PYTHON
          $env:PYTHONHOME = $null
          if (-not (Test-Path "$PLUGIN\.venv\Scripts\python.exe")) {
            Write-Error "FAIL: uv sync failed with PYTHONHOME set"
            exit 1
          }
          Write-Host "PASS: uv sync works with PYTHONHOME set"

          # Test 4: uv sync works when PYTHONHOME points to wrong location
          Remove-Item -Recurse -Force "$PLUGIN\.venv"
          $env:PYTHONHOME = "C:\nonexistent\path"
          uv sync --project $PLUGIN --python $PYTHON
          $env:PYTHONHOME = $null
          if (-not (Test-Path "$PLUGIN\.venv\Scripts\python.exe")) {
            Write-Error "FAIL: uv sync failed with wrong PYTHONHOME"
            exit 1
          }
          Write-Host "PASS: uv sync resilient to wrong PYTHONHOME"

  build-windows:
    needs: windows-preflight
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    env:
      VCPKG_ROOT: ${{ github.workspace }}\..\vcpkg
      VCPKG_BUILD_TYPE: release
      CUDA_PATH: "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v12.8"
      BUILD_DIR: b

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install CUDA 12.8
        run: |
          cd ..
          Invoke-WebRequest https://developer.download.nvidia.com/compute/cuda/12.8.0/local_installers/cuda_12.8.0_571.96_windows.exe -OutFile cuda.exe -Verbose
          Start-Process -FilePath .\cuda.exe -ArgumentList "-y -s -accepteula -toolkit -override -noDisplayDriver" -Wait

      - name: Set CUDA environment
        run: |
          echo "CUDA_PATH=C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "CUDA_PATH_V12_8=C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8\libnvvp" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Normalize vcpkg path
        run: '"VCPKG_ROOT=$([System.IO.Path]::GetFullPath($env:VCPKG_ROOT))" >> $env:GITHUB_ENV'

      - name: Cache vcpkg tool
        id: cache-vcpkg-tool
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_ROOT }}
          # The vcpkg checkout must contain every pinned port version, so the key moves
          # with the pins. No restore-keys: an older clone restored under a new key
          # would make the clone below fail on the existing directory.
          key: vcpkg-tool-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Setup vcpkg
        if: steps.cache-vcpkg-tool.outputs.cache-hit != 'true'
        run: |
          cd ..
          git clone https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Cache vcpkg_installed
        uses: actions/cache@v6
        with:
          path: ${{ env.BUILD_DIR }}/vcpkg_installed
          key: vcpkg-installed-${{ runner.os }}-prebuilt-ort-v1-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.github/overlays/**') }}
          restore-keys: vcpkg-installed-${{ runner.os }}-prebuilt-ort-v1-

      - name: Restore vcpkg downloads
        id: cache-vcpkg-downloads
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.VCPKG_ROOT }}/downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.github/overlays/**') }}
          restore-keys: vcpkg-downloads-${{ runner.os }}-

      - name: Configure
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if "${{ matrix.build_type }}"=="Release" (
            python tools/ci_retry_configure.py -- cmake -B %BUILD_DIR% -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_PORTABLE=ON -DBUILD_FORMAT_TESTS=OFF -DBUILD_VISUALIZER_TESTS=OFF -DBUILD_UNICODE_TEST_ONLY=OFF -DBUILD_PYTHON_STUBS=OFF -DLFS_DEV_IMPORT_SOURCE_PYTHON=OFF -DLFS_DEV_IMPORT_SOURCE_RESOURCES=OFF -DLFS_ENABLE_CUDA_DEVICE_DEBUG=OFF
          ) else (
            python tools/ci_retry_configure.py -- cmake -B %BUILD_DIR% -S . -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLFS_FAST_COMPILE=ON -DBUILD_FORMAT_TESTS=ON -DBUILD_VISUALIZER_TESTS=ON -DBUILD_UNICODE_TEST_ONLY=ON -DBUILD_PYTHON_STUBS=OFF -DLFS_DEV_IMPORT_SOURCE_PYTHON=OFF -DLFS_DEV_IMPORT_SOURCE_RESOURCES=OFF -DLFS_ENABLE_CUDA_DEVICE_DEBUG=OFF
          )

      # Save fetched archives even when configure fails later. vcpkg verifies
      # downloaded archives against their hashes.
      - name: Save vcpkg downloads
        if: always() && !cancelled() && steps.cache-vcpkg-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.VCPKG_ROOT }}/downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.github/overlays/**') }}

      - name: Generate shader headers for preflight
        shell: cmd
        env:
          VCPKG_RUNTIME_SUBDIR: ${{ matrix.build_type == 'Debug' && 'debug\bin' || 'bin' }}
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set PATH=%CD%\%BUILD_DIR%\vcpkg_installed\x64-windows\%VCPKG_RUNTIME_SUBDIR%;%PATH%
          cmake --build %BUILD_DIR% --target lfs_shader_headers --config ${{ matrix.build_type }} -j 4

      - name: Run configured MSVC preflight
        shell: cmd
        env:
          LFS_PREFLIGHT_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          python tools\windows_build_preflight.py --skip-source-checks --compile-commands %BUILD_DIR%\compile_commands.json --max-commands 512

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set PATH=%CD%\%BUILD_DIR%;%CD%\%BUILD_DIR%\vcpkg_installed\x64-windows\bin;%PATH%
          cmake --build %BUILD_DIR% -j %NUMBER_OF_PROCESSORS%

      - name: Run CPU-only SDL coordinate tests
        if: matrix.build_type == 'Debug'
        # The default app build also builds this isolated, SDL-free test executable.
        shell: cmd
        run: ctest --test-dir %BUILD_DIR% --output-on-failure --no-tests=error -R "^lichtfeld\.sdl_coordinates$"

      - name: Run Python runtime DLL boundary tests
        if: matrix.build_type == 'Debug'
        shell: cmd
        run: ctest --test-dir %BUILD_DIR% --output-on-failure --no-tests=error -R "^lichtfeld\.python_runtime_state$"

      - name: Run splat drag contracts
        if: matrix.build_type == 'Debug'
        shell: cmd
        run: ctest --test-dir %BUILD_DIR% --output-on-failure --no-tests=error -R "^(selection_outline_contract|splat_drag_axes_contract|splat_transfer_contract|native_drag_contract|file_transfer_progress_contract|native_modal_frame_contract)$"

      - name: Provision a network share for path tests
        if: matrix.build_type == 'Debug'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $local = Join-Path $env:RUNNER_TEMP 'lfs-unc-share'
          New-Item -ItemType Directory -Force -Path $local | Out-Null
          Start-Service LanmanServer
          New-SmbShare -Name 'lfs-unc-tests' -Path $local -FullAccess "$env:USERDOMAIN\$env:USERNAME" | Out-Null
          $network = '\\localhost\lfs-unc-tests'
          Set-Content -Path (Join-Path $network 'probe.txt') -Value 'probe'
          if (-not (Test-Path (Join-Path $local 'probe.txt'))) { throw "Share $network does not expose $local" }
          Remove-Item (Join-Path $local 'probe.txt')
          "LFS_TEST_UNC_ROOT=$network" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LFS_TEST_UNC_LOCAL=$local" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LFS_TEST_REQUIRE_UNC=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and run CPU-only format tests
        if: matrix.build_type == 'Debug'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build %BUILD_DIR% --target lichtfeld_format_tests -j %NUMBER_OF_PROCESSORS%
          ctest --test-dir %BUILD_DIR% --output-on-failure --no-tests=error -R "^lichtfeld_format_tests$"

      - name: Build and run EXR image codec tests
        if: matrix.build_type == 'Debug'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build %BUILD_DIR% --target lichtfeld_image_codec_tests -j %NUMBER_OF_PROCESSORS%
          ctest --test-dir %BUILD_DIR% --output-on-failure --no-tests=error -R "^lichtfeld_image_codec_tests$"

      - name: Build and run CPU-only Unicode path tests
        if: matrix.build_type == 'Debug'
        shell: cmd
        env:
          VCPKG_RUNTIME_SUBDIR: ${{ matrix.build_type == 'Debug' && 'debug\bin' || 'bin' }}
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set PATH=%CD%\%BUILD_DIR%;%CD%\%BUILD_DIR%\vcpkg_installed\x64-windows\%VCPKG_RUNTIME_SUBDIR%;%CD%\%BUILD_DIR%\vcpkg_installed\x64-windows\bin;%PATH%
          cmake --build %BUILD_DIR% --target unicode_path_test lichtfeld_native_filesystem_tests -j %NUMBER_OF_PROCESSORS%
          if errorlevel 1 exit /b 1
          %BUILD_DIR%\tests\unicode_path_test.exe --gtest_color=no
          if errorlevel 1 exit /b 1
          %BUILD_DIR%\tests\lichtfeld_native_filesystem_tests.exe --gtest_color=no

      - name: Test Python paths without executable long-path opt-in
        if: matrix.build_type == 'Debug'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if not exist %BUILD_DIR%\path-policy-off-python mkdir %BUILD_DIR%\path-policy-off-python
          copy /Y %BUILD_DIR%\vcpkg_installed\x64-windows\tools\python3\python.exe %BUILD_DIR%\path-policy-off-python\python.exe
          if errorlevel 1 exit /b 1
          copy /Y %BUILD_DIR%\vcpkg_installed\x64-windows\tools\python3\python312.dll %BUILD_DIR%\path-policy-off-python\python312.dll
          if errorlevel 1 exit /b 1
          mt.exe -nologo -manifest tests\native_filesystem_test.manifest -outputresource:%BUILD_DIR%\path-policy-off-python\python.exe;#1
          if errorlevel 1 exit /b 1
          set PYTHONHOME=%CD%\%BUILD_DIR%\vcpkg_installed\x64-windows\tools\python3
          set PYTHONPATH=%CD%\src\python
          set LFS_REQUIRE_LONG_PATHS_DISABLED=1
          set PYTHONUTF8=1
          %BUILD_DIR%\path-policy-off-python\python.exe -m unittest tests/python/test_native_path_io.py

      - name: Test native Python path metadata without long-path opt-in
        if: matrix.build_type == 'Debug'
        if: matrix.build_type == 'Debug'
        shell: cmd
        run: |
          set PYTHONHOME=%CD%\%BUILD_DIR%\vcpkg_installed\x64-windows\tools\python3
          set PYTHONPATH=%CD%\src\python;%CD%\%BUILD_DIR%\src\python
          set PYTHONUTF8=1
          set LFS_REQUIRE_LONG_PATHS_DISABLED=1
          %BUILD_DIR%\path-policy-off-python\python.exe -c "import os, unittest; build = os.path.abspath(os.environ['BUILD_DIR']); dll_dirs = [build, os.path.join(build, 'vcpkg_installed', 'x64-windows', 'bin'), os.path.join(os.environ['CUDA_PATH'], 'bin')]; dll_handles = [os.add_dll_directory(path) for path in dll_dirs]; suite = unittest.defaultTestLoader.discover('tests/python', pattern='test_native_binding_path_io.py'); result = unittest.TextTestRunner(verbosity=2).run(suite); raise SystemExit(not result.wasSuccessful())"

      - name: Build and run CPU-only visualizer and RmlUi tests
        if: matrix.build_type == 'Debug'
        shell: cmd
        env:
          VCPKG_RUNTIME_SUBDIR: ${{ matrix.build_type == 'Debug' && 'debug\bin' || 'bin' }}
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set PATH=%CD%\%BUILD_DIR%;%CD%\%BUILD_DIR%\vcpkg_installed\x64-windows\%VCPKG_RUNTIME_SUBDIR%;%CD%\%BUILD_DIR%\vcpkg_installed\x64-windows\bin;%CD%\%BUILD_DIR%\vcpkg_installed\x64-windows\tools\python3;%CUDA_PATH%\bin;%PATH%
          cmake --build %BUILD_DIR% --target lichtfeld_visualizer_tests lichtfeld_rmlui_tests lichtfeld_native_third_party_tests -j %NUMBER_OF_PROCESSORS%
          ctest --test-dir %BUILD_DIR% --output-on-failure -R "^(lichtfeld_visualizer_tests|lichtfeld\.rmlui|lichtfeld\.native_third_party_paths)$"

      - name: Install portable Release distribution
        if: matrix.build_type == 'Release'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:RUNNER_TEMP 'lichtfeld-dist'
          cmake --install $env:BUILD_DIR --prefix $dist
          $exe = Join-Path $dist 'bin\LichtFeld-Studio.exe'
          $runtime = Join-Path $dist 'bin\nvjpeg2k_0.dll'
          $extensions = @(Get-ChildItem (Join-Path $dist 'extensions') -Filter 'nvjpeg2k_ext*.dll' -ErrorAction SilentlyContinue)
          if (-not (Test-Path $exe)) { throw "Installed executable missing: $exe" }
          if (-not (Test-Path $runtime)) { throw "Installed nvJPEG2000 runtime missing: $runtime" }
          if ($extensions.Count -eq 0) { throw "Installed nvJPEG2000 extension missing from $dist\extensions" }
          if (-not (Test-Path (Join-Path $dist 'LICENSE'))) { throw 'Installed GPL license missing' }
          if (-not (Test-Path (Join-Path $dist 'LICENSE-EXCEPTION.txt'))) { throw 'Installed NVIDIA license exception missing' }
          Write-Host "Portable install verified: $dist"

      - name: Package Windows Release portable artifact
        if: matrix.build_type == 'Release'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:RUNNER_TEMP 'lichtfeld-dist'
          $zip = Join-Path $env:RUNNER_TEMP 'LichtFeld-Studio-Windows-x64-Release.zip'
          Compress-Archive -Path (Join-Path $dist '*') -DestinationPath $zip -CompressionLevel Optimal
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $names = @($archive.Entries | ForEach-Object FullName)
            foreach ($required in @('bin/LichtFeld-Studio.exe', 'LICENSE', 'LICENSE-EXCEPTION.txt')) {
              if ($names -notcontains $required) { throw "Portable ZIP missing $required" }
            }
            if (-not ($names | Where-Object { $_ -like 'share/LichtFeld-Studio/*' })) { throw 'Portable ZIP missing installed resources' }
            if (-not ($names | Where-Object { $_ -like 'extensions/nvjpeg2k_ext*.dll' })) { throw 'Portable ZIP missing nvJPEG2000 extension' }
            Write-Host "Portable ZIP verified: $($archive.Entries.Count) entries"
          } finally { $archive.Dispose() }

      - name: Upload Windows Release portable artifact
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: LichtFeld-Studio-Windows-x64-Release
          path: ${{ runner.temp }}/LichtFeld-Studio-Windows-x64-Release.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14